services:
  db:
    image: postgres:17-alpine
    container_name: reschedule-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-reschedule}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${DB_USER:-postgres} -d ${DB_NAME:-escheduler}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-reschedule}?sslmode=disable
      - up
    container_name: reschedule-migrate
    depends_on:
      db:
        condition: service_healthy
  bot:
    build:
      context: .
    container_name: reschedule-bot
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    profiles:
      - bot
    volumes:
      - ./.env:/opt/api/.env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
